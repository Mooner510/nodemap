name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  pipeline:
    name: CI
    uses: Mooner510/workflows/.github/workflows/pipeline.yml@v1
    with:
      components: |
        [
          {
            "name": "android",
            "type": "java-kotlin",
            "path": ".",
            "profile": "android"
          }
        ]
      # Android has no deploy_services entry: dev pushes run CI only.
      # Production Android release remains explicit/manual through deploy.yml and android-production.
