name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      diff_base:
        description: Optional ancestor SHA for maintenance-triggered CI.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: Mooner510/workflows/.github/workflows/project-ci.yml@v1
    with:
      diff_base: ${{ inputs.diff_base || '' }}
