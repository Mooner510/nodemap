name: Release Android

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-nodemap-android
  cancel-in-progress: false

jobs:
  android:
    environment: production
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    steps:
      - name: Build and release Android app
        uses: Mooner510/workflows/.github/actions/cd/android-production@v1
        with:
          working-directory: .
