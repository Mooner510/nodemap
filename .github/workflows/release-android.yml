name: Release Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional semantic version (MAJOR.MINOR.PATCH)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-nodemap-android
  cancel-in-progress: false

jobs:
  android:
    if: github.actor == 'Mooner510' && github.triggering_actor == 'Mooner510'
    environment: production
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    steps:
      - name: Build Android app
        uses: Mooner510/workflows/.github/actions/cd/android-production@v1
        with:
          working-directory: .
          version: ${{ inputs.version }}
