name: Deploy

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Production operation
        required: true
        type: choice
        options: [deploy]
        default: deploy
      all:
        description: Deploy all GitHub-managed services
        required: true
        type: boolean
        default: true
      android:
        description: Build Android release
        required: true
        type: boolean
        default: false
      version:
        description: Optional semantic version (MAJOR.MINOR.PATCH)
        required: false
        type: string

permissions:
  contents: read

jobs:
  android:
    name: Build Android release
    if: (inputs.all || inputs.android) && github.actor == 'Mooner510' && github.triggering_actor == 'Mooner510'
    environment: production
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    concurrency:
      group: production-nodemap-android
      cancel-in-progress: false
    steps:
      - name: Build Android app
        uses: Mooner510/workflows/.github/actions/cd/android-production@v1
        with:
          working-directory: .
          version: ${{ inputs.version }}
